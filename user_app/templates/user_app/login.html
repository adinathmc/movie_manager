{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" >
    <meta http-equiv="X-UA-Compatible" content="IE=edge" >
    <meta name="viewport" content="" width="device-width,initial-1.0" >

    <title>Login page</title>
    <link rel="stylesheet" href="{% static 'user_app/style.css' %}">
    <link href='https://cdn.boxicons.com/fonts/basic/boxicons.min.css' rel='stylesheet'>
  </head>
  <script>
  document.addEventListener("mousemove", function (e) {
    let star = document.createElement("div");
    star.className = "star";
    star.style.left = e.pageX + "px";
    star.style.top = e.pageY + "px";
    document.body.appendChild(star);

    setTimeout(() => {
      star.remove();
    }, 1000);
  });
</script>

  <body>
    <div class="wrapper">
      <form action=" " method="post"> <!--For Python Django-->
        {% csrf_token %}  <!--For Python Django-->
        <h1>Login</h1>
        <div class="input-box">
          <input type="text" placeholder="username" name = "username" required>
          <i class='bx  bx-user'></i> 
          </div>
          <div class="input-box">
          <input type="password" placeholder="password" name = "password" required>
          <i class='bx  bx-lock'></i> 
          </div>
        <div class="remember-forget">
        <label> <input type="checkbox">Remember me</label>
        <a href="#">Forget password</a> <!-- set forget password href here-->
        </div>
        <button class="btn" type="submit" >Login</button>
        <div class="register-link">
          <p>Don't have an account?<a href="{% url 'register_user' %}">Register</a></p> <!--Set Register Href here-->
        </div>
      </form>
    </div>
  </body>
</html>
